<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>音樂節奏遊戲</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Microsoft JhengHei";
}

body{
    background:linear-gradient(180deg,#1b1b3a,#111);
    overflow:hidden;
    height:100vh;
}

h1{
    position:absolute;
    top:10px;
    width:100%;
    text-align:center;
    color:white;
    z-index:10;
    letter-spacing:3px;
}

#game{
    width:420px;
    height:90vh;
    margin:40px auto;
    background:#222;
    border:4px solid white;
    position:relative;
    overflow:hidden;
    display:flex;
}

.lane{
    flex:1;
    border-left:1px solid rgba(255,255,255,0.2);
    border-right:1px solid rgba(255,255,255,0.2);
    position:relative;
}

.hitLine{
    position:absolute;
    bottom:80px;
    width:100%;
    height:8px;
    background:#00ffe5;
    box-shadow:0 0 15px #00ffe5;
}

.note{
    width:80%;
    height:25px;
    background:linear-gradient(45deg,#ff4fd8,#7d7dff);
    border-radius:10px;
    position:absolute;
    left:10%;
    top:-30px;
    animation:fall 2s linear forwards;
}

@keyframes fall{
    from{
        top:-30px;
    }
    to{
        top:100%;
    }
}

.key{
    position:absolute;
    bottom:20px;
    width:100%;
    text-align:center;
    color:white;
    font-size:24px;
    font-weight:bold;
}

#score{
    position:absolute;
    top:50px;
    width:100%;
    text-align:center;
    color:#fff;
    font-size:22px;
    z-index:10;
}

.effect{
    position:absolute;
    bottom:70px;
    width:100%;
    text-align:center;
    font-size:30px;
    color:#fff;
    animation:pop 0.4s;
}

@keyframes pop{
    from{
        transform:scale(0.5);
        opacity:1;
    }
    to{
        transform:scale(1.5);
        opacity:0;
    }
}
</style>
</head>

<body>

<h1>PROJECT MUSIC</h1>
<div id="score">Score：0</div>

<div id="game">

    <div class="lane" data-key="d">
        <div class="hitLine"></div>
        <div class="key">D</div>
    </div>

    <div class="lane" data-key="f">
        <div class="hitLine"></div>
        <div class="key">F</div>
    </div>

    <div class="lane" data-key="j">
        <div class="hitLine"></div>
        <div class="key">J</div>
    </div>

    <div class="lane" data-key="k">
        <div class="hitLine"></div>
        <div class="key">K</div>
    </div>

</div>

<script>

const lanes = document.querySelectorAll(".lane");
const scoreText = document.getElementById("score");

let score = 0;

function createNote(){

    const laneIndex = Math.floor(Math.random()*4);
    const lane = lanes[laneIndex];

    const note = document.createElement("div");
    note.classList.add("note");

    lane.appendChild(note);

    note.dataset.hit = "false";

    setTimeout(()=>{
        if(note.parentNode){
            note.remove();
        }
    },2000);
}

setInterval(createNote,700);

document.addEventListener("keydown",(e)=>{

    const key = e.key.toLowerCase();

    lanes.forEach(lane=>{

        if(lane.dataset.key === key){

            const note = lane.querySelector(".note");

            if(note){

                const noteTop = note.getBoundingClientRect().top;
                const laneBottom = lane.querySelector(".hitLine").getBoundingClientRect().top;

                const distance = Math.abs(noteTop - laneBottom);

                if(distance < 80){

                    note.remove();

                    score += 100;
                    scoreText.innerText = "Score：" + score;

                    const effect = document.createElement("div");
                    effect.classList.add("effect");
                    effect.innerText = "PERFECT";

                    lane.appendChild(effect);

                    setTimeout(()=>{
                        effect.remove();
                    },400);

                }
            }
        }

    });

});

</script>

</body>
</html>
