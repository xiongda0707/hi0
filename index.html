<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROJECT MUSIC</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Microsoft JhengHei";
}

body{
    background:#111;
    overflow:hidden;
    height:100vh;
    transition:background 0.3s;
}

h1{
    position:absolute;
    top:10px;
    width:100%;
    text-align:center;
    color:white;
    z-index:10;
    letter-spacing:4px;
    text-shadow:0 0 10px cyan;
}

#score{
    position:absolute;
    top:55px;
    width:100%;
    text-align:center;
    color:white;
    font-size:24px;
    z-index:10;
}

#game{
    width:420px;
    height:90vh;
    margin:40px auto;
    background:rgba(255,255,255,0.05);
    border:3px solid white;
    display:flex;
    position:relative;
    overflow:hidden;
    backdrop-filter: blur(10px);
}

.lane{
    flex:1;
    position:relative;
    border-left:1px solid rgba(255,255,255,0.2);
    border-right:1px solid rgba(255,255,255,0.2);
}

.hitLine{
    position:absolute;
    bottom:80px;
    width:100%;
    height:8px;
    background:#00ffe5;
    box-shadow:0 0 20px #00ffe5;
}

.note{
    width:80%;
    height:25px;
    position:absolute;
    left:10%;
    top:-30px;
    border-radius:10px;
    animation:fall 2s linear forwards;
    background:linear-gradient(45deg,#ff4fd8,#6a5cff);
    box-shadow:0 0 15px #ff4fd8;
}

@keyframes fall{
    from{
        top:-30px;
    }
    to{
        top:100%;
    }
}

.key{
    position:absolute;
    bottom:20px;
    width:100%;
    text-align:center;
    color:white;
    font-size:28px;
    font-weight:bold;
}

.effect{
    position:absolute;
    bottom:120px;
    width:100%;
    text-align:center;
    color:white;
    font-size:32px;
    font-weight:bold;
    animation:pop 0.5s forwards;
}

@keyframes pop{
    from{
        transform:scale(0.5);
        opacity:1;
    }
    to{
        transform:scale(1.8);
        opacity:0;
    }
}

#startBtn{
    position:absolute;
    top:100px;
    left:50%;
    transform:translateX(-50%);
    padding:12px 30px;
    border:none;
    border-radius:15px;
    background:#00ffe5;
    color:#111;
    font-size:20px;
    cursor:pointer;
    z-index:20;
    box-shadow:0 0 20px #00ffe5;
}

</style>
</head>

<body>

<h1>PROJECT MUSIC</h1>
<div id="score">Score：0</div>

<button id="startBtn">開始遊戲</button>

<div id="game">

    <div class="lane" data-key="d">
        <div class="hitLine"></div>
        <div class="key">D</div>
    </div>

    <div class="lane" data-key="f">
        <div class="hitLine"></div>
        <div class="key">F</div>
    </div>

    <div class="lane" data-key="j">
        <div class="hitLine"></div>
        <div class="key">J</div>
    </div>

    <div class="lane" data-key="k">
        <div class="hitLine"></div>
        <div class="key">K</div>
    </div>

</div>

<!-- 音樂 -->
<audio id="bgm" loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

<script>

const lanes = document.querySelectorAll(".lane");
const scoreText = document.getElementById("score");
const bgm = document.getElementById("bgm");
const startBtn = document.getElementById("startBtn");

let score = 0;
let gameStarted = false;

function createNote(){

    const laneIndex = Math.floor(Math.random()*4);
    const lane = lanes[laneIndex];

    const note = document.createElement("div");
    note.classList.add("note");

    lane.appendChild(note);

    setTimeout(()=>{
        if(note.parentNode){
            note.remove();
        }
    },2000);
}

function startGame(){

    if(gameStarted) return;

    gameStarted = true;

    bgm.play();

    setInterval(createNote,650);

    // 背景隨節奏改變
    setInterval(()=>{

        const colors = [
            "#1b1b3a",
            "#2b1055",
            "#001f3f",
            "#3a0f2d",
            "#112244",
            "#440044"
        ];

        document.body.style.background =
            colors[Math.floor(Math.random()*colors.length)];

    },500);

    startBtn.style.display = "none";
}

startBtn.addEventListener("click",startGame);

document.addEventListener("keydown",(e)=>{

    const key = e.key.toLowerCase();

    lanes.forEach(lane=>{

        if(lane.dataset.key === key){

            const note = lane.querySelector(".note");

            if(note){

                const noteTop = note.getBoundingClientRect().top;
                const hitTop = lane.querySelector(".hitLine")
                                   .getBoundingClientRect().top;

                const distance = Math.abs(noteTop - hitTop);

                if(distance < 80){

                    note.remove();

                    score += 100;

                    scoreText.innerText = "Score：" + score;

                    const effect = document.createElement("div");

                    effect.classList.add("effect");

                    effect.innerText = "PERFECT";

                    lane.appendChild(effect);

                    setTimeout(()=>{
                        effect.remove();
                    },500);

                }
            }
        }

    });

});

</script>

</body>
</html>
